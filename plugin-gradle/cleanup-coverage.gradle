// =============================================================================
// Coverage gates (JaCoCo + PIT) for the Eclipse JDT Clean Up DSL added to
// plugin-gradle.
//
// Scope: ONLY the new code we own — the JavaExtension.EclipseCleanUpConfig
// inner class and the two `eclipseCleanUp()` factory methods on JavaExtension.
// All other DSL surfaces (existing extensions, formatters, ...) are out of
// scope so the 100% requirement applies only to clean-up code.
//
// The `jacoco` plugin itself is applied in plugin-gradle/build.gradle's
// plugins block (Gradle 8+ requires plugins to be declared there).
// =============================================================================

def cleanupClassFilters = [
	'com/diffplug/gradle/spotless/JavaExtension$EclipseCleanUpConfig*.class'
]

jacoco {
	toolVersion = '0.8.13' // keep aligned with the rest of the Spotless repo
}

tasks.withType(Test).configureEach {
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(
			files(sourceSets.main.output.classesDirs.collect {
				fileTree(dir: it, includes: cleanupClassFilters)
			})
			)
	sourceDirectories.setFrom(files('src/main/java'))
}

tasks.register('jacocoCleanUpVerification', JacocoCoverageVerification) {
	dependsOn tasks.named('test')
	executionData.setFrom(fileTree(layout.buildDirectory).include('jacoco/test.exec'))
	classDirectories.setFrom(
			files(sourceSets.main.output.classesDirs.collect {
				fileTree(dir: it, includes: cleanupClassFilters)
			})
			)
	violationRules {
		rule {
			limit {
				counter = 'INSTRUCTION'
				minimum = 1.0
			}
			limit {
				counter = 'BRANCH'
				minimum = 1.0
			}
			limit {
				counter = 'LINE'
				minimum = 1.0
			}
		}
	}
}

// Wire the verification gate into the standard `check` lifecycle.
tasks.named('check') {
	dependsOn tasks.named('jacocoCleanUpVerification')
}

// -----------------------------------------------------------------------------
// PIT mutation testing — same JavaExec strategy as lib-extra/cleanup-coverage.gradle
// because the official Gradle plugin (info.solidsoft.pitest 1.15.0) is not
// Gradle-9 compatible.
// -----------------------------------------------------------------------------
configurations {
	pitestRuntime
}

dependencies {
	pitestRuntime "org.pitest:pitest-command-line:1.20.5"
	pitestRuntime "org.pitest:pitest-junit5-plugin:1.2.3"
	pitestRuntime "org.pitest:pitest-entry:1.20.5"
	pitestRuntime libs.junit.jupiter
	pitestRuntime "org.junit.platform:junit-platform-launcher:6.0.3"
}

tasks.register('pitestCleanUp', JavaExec) {
	// PIT runs its own targeted test execution; depending on `test` would couple us to flaky
	// tests in unrelated modules (e.g. BiomeIntegrationTest). We only need the test classes
	// compiled and the lib jar built.
	dependsOn tasks.named('compileTestJava'), tasks.named('jar')
	description = 'Runs PIT mutation testing on the Eclipse JDT clean-up DSL classes.'
	group = 'verification'
	classpath = configurations.pitestRuntime + sourceSets.test.runtimeClasspath + files(tasks.named('jar'))
	mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'
	// ProjectBuilder (used by JavaEclipseCleanUpUnitTest) requires a number of `--add-opens`
	// flags to reflectively touch Gradle's internals on JDK 17+. Mirror them here so PIT's
	// minion JVMs can run our tests as the regular `test` task does.
	jvmArgs([
		'--add-opens=java.base/java.lang=ALL-UNNAMED',
		'--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
		'--add-opens=java.base/java.util=ALL-UNNAMED',
		'--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
		'--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
		'--add-opens=java.base/java.nio.charset=ALL-UNNAMED',
		'--add-opens=java.base/java.net=ALL-UNNAMED',
		'--add-opens=java.base/java.time=ALL-UNNAMED',
		'--add-opens=java.prefs/java.util.prefs=ALL-UNNAMED',
		'--add-opens=java.xml/javax.xml.namespace=ALL-UNNAMED',
		'--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
		'--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
	])
	def reportDir = layout.buildDirectory.dir('reports/pitest').get().asFile
	doFirst {
		reportDir.mkdirs()
	}
	def cleanupTargetClasses = [
		'com.diffplug.gradle.spotless.JavaExtension$EclipseCleanUpConfig',
		'com.diffplug.gradle.spotless.JavaExtension$EclipseCleanUpConfig$*'
	]
	def cleanupTargetTests = [
		'com.diffplug.gradle.spotless.JavaEclipseCleanUpUnitTest',
		'com.diffplug.gradle.spotless.JavaEclipseCleanUpUnitTest$*'
	]
	args = [
		'--reportDir',
		reportDir.absolutePath,
		'--targetClasses',
		cleanupTargetClasses.join(','),
		'--targetTests',
		cleanupTargetTests.join(','),
		'--sourceDirs',
		'src/main/java',
		'--testPlugin',
		'junit5',
		'--mutators',
		'STRONGER',
		'--mutationThreshold',
		'95',
		'--coverageThreshold',
		'95',
		'--timeoutConst',
		'300000',
		'--threads',
		'1',
		'--outputFormats',
		'HTML,XML',
		// Pass the same opens to PIT's minion JVMs that fork off to run individual mutations.
		'--argLine',
		'--add-opens=java.base/java.lang=ALL-UNNAMED ' +
		'--add-opens=java.base/java.lang.invoke=ALL-UNNAMED ' +
		'--add-opens=java.base/java.util=ALL-UNNAMED ' +
		'--add-opens=java.base/java.util.concurrent=ALL-UNNAMED ' +
		'--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED ' +
		'--add-opens=java.base/java.nio.charset=ALL-UNNAMED ' +
		'--add-opens=java.base/java.net=ALL-UNNAMED ' +
		'--add-opens=java.base/java.time=ALL-UNNAMED ' +
		'--add-opens=java.prefs/java.util.prefs=ALL-UNNAMED ' +
		'--add-opens=java.xml/javax.xml.namespace=ALL-UNNAMED ' +
		'--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED ' +
		'--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
	]
}
