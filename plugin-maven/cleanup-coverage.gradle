// =============================================================================
// Coverage gates (JaCoCo + PIT) for the Eclipse JDT Clean Up Maven mojo.
//
// Scope: ONLY the EclipseCleanUp mojo. Every other Spotless mojo is out of
// scope so the 100% requirement applies only to clean-up code.
//
// The `jacoco` plugin itself is applied in plugin-maven/build.gradle (Gradle
// 8+ requires plugins to be declared up-front).
// =============================================================================

def cleanupClassFilters = [
	'com/diffplug/spotless/maven/java/EclipseCleanUp*.class'
]

jacoco {
	toolVersion = '0.8.13' // keep aligned with the rest of the Spotless repo
}

tasks.withType(Test).configureEach {
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(
			files(sourceSets.main.output.classesDirs.collect {
				fileTree(dir: it, includes: cleanupClassFilters)
			})
			)
	sourceDirectories.setFrom(files('src/main/java'))
}

tasks.register('jacocoCleanUpVerification', JacocoCoverageVerification) {
	dependsOn tasks.named('test')
	executionData.setFrom(fileTree(layout.buildDirectory).include('jacoco/test.exec'))
	classDirectories.setFrom(
			files(sourceSets.main.output.classesDirs.collect {
				fileTree(dir: it, includes: cleanupClassFilters)
			})
			)
	violationRules {
		rule {
			limit {
				counter = 'INSTRUCTION'
				minimum = 1.0
			}
			limit {
				counter = 'BRANCH'
				minimum = 1.0
			}
			limit {
				counter = 'LINE'
				minimum = 1.0
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoCleanUpVerification')
}

// -----------------------------------------------------------------------------
// PIT mutation testing (same JavaExec strategy as lib-extra / plugin-gradle).
// -----------------------------------------------------------------------------
configurations {
	pitestRuntime
}

dependencies {
	pitestRuntime "org.pitest:pitest-command-line:1.20.5"
	pitestRuntime "org.pitest:pitest-junit5-plugin:1.2.3"
	pitestRuntime "org.pitest:pitest-entry:1.20.5"
	pitestRuntime libs.junit.jupiter
	pitestRuntime "org.junit.platform:junit-platform-launcher:6.0.3"
}

tasks.register('pitestCleanUp', JavaExec) {
	// PIT runs its own targeted test execution; depending on `test` would couple us to flaky
	// integration tests in unrelated modules.
	dependsOn tasks.named('compileTestJava'), tasks.named('jar')
	description = 'Runs PIT mutation testing on the Eclipse JDT clean-up Maven mojo.'
	group = 'verification'
	classpath = configurations.pitestRuntime + sourceSets.test.runtimeClasspath + files(tasks.named('jar'))
	mainClass = 'org.pitest.mutationtest.commandline.MutationCoverageReport'
	def reportDir = layout.buildDirectory.dir('reports/pitest').get().asFile
	doFirst {
		reportDir.mkdirs()
	}
	def cleanupTargetClasses = [
		'com.diffplug.spotless.maven.java.EclipseCleanUp',
		'com.diffplug.spotless.maven.java.EclipseCleanUp$*'
	]
	def cleanupTargetTests = [
		'com.diffplug.spotless.maven.java.EclipseCleanUpUnitTest',
		'com.diffplug.spotless.maven.java.EclipseCleanUpUnitTest$*'
	]
	args = [
		'--reportDir',
		reportDir.absolutePath,
		'--targetClasses',
		cleanupTargetClasses.join(','),
		'--targetTests',
		cleanupTargetTests.join(','),
		'--sourceDirs',
		'src/main/java',
		'--testPlugin',
		'junit5',
		'--mutators',
		'STRONGER',
		'--mutationThreshold',
		'95',
		'--coverageThreshold',
		'95',
		'--timeoutConst',
		'300000',
		'--threads',
		'1',
		'--outputFormats',
		'HTML,XML'
	]
}
